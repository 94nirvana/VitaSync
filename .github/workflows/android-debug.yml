name: Android debug APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          tools_root="$sdk_root/cmdline-tools"
          mkdir -p "$tools_root"
          curl -fL --retry 3 --connect-timeout 20 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$RUNNER_TEMP/android-command-line-tools.zip"
          unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" -d "$tools_root"
          mv "$tools_root/cmdline-tools" "$tools_root/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$tools_root/latest/bin" >> "$GITHUB_PATH"

          sdkmanager="$tools_root/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$sdk_root" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vitasync-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
